<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#374151"/>
      <stop offset="100%" style="stop-color:#1f2937"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#gearGrad)"/>

  <!-- Outer ring (gear) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#dc2626" stroke-width="16"/>

  <!-- Gear teeth -->
  <g fill="#374151">
    <rect x="240" y="20" width="32" height="40" rx="4"/>
    <rect x="240" y="452" width="32" height="40" rx="4"/>
    <rect x="20" y="240" width="40" height="32" rx="4"/>
    <rect x="452" y="240" width="40" height="32" rx="4"/>
    <rect x="76" y="76" width="32" height="40" rx="4" transform="rotate(45 92 96)"/>
    <rect x="404" y="76" width="32" height="40" rx="4" transform="rotate(-45 420 96)"/>
    <rect x="76" y="396" width="32" height="40" rx="4" transform="rotate(-45 92 416)"/>
    <rect x="404" y="396" width="32" height="40" rx="4" transform="rotate(45 420 416)"/>
  </g>

  <!-- Clock face -->
  <circle cx="256" cy="256" r="140" fill="#f8fafc"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#dc2626" stroke-width="8"/>

  <!-- Hour markers -->
  <g stroke="#1f2937" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="130" x2="256" y2="150"/>
    <line x1="256" y1="362" x2="256" y2="382"/>
    <line x1="130" y1="256" x2="150" y2="256"/>
    <line x1="362" y1="256" x2="382" y2="256"/>
  </g>

  <!-- Clock hands -->
  <line x1="256" y1="256" x2="256" y2="160" stroke="#1f2937" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="320" y2="256" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="16" fill="#dc2626"/>
</svg>
