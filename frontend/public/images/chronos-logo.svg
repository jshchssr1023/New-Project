<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="chronosGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gearGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f2937;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Gear/Clock Icon -->
  <g transform="translate(10, 8)">
    <!-- Outer gear -->
    <circle cx="22" cy="22" r="18" fill="url(#gearGradient)" stroke="#dc2626" stroke-width="2"/>
    <!-- Gear teeth -->
    <path d="M22 2 L24 6 L20 6 Z" fill="#374151"/>
    <path d="M22 42 L24 38 L20 38 Z" fill="#374151"/>
    <path d="M2 22 L6 24 L6 20 Z" fill="#374151"/>
    <path d="M42 22 L38 24 L38 20 Z" fill="#374151"/>
    <!-- Clock face -->
    <circle cx="22" cy="22" r="12" fill="#f8fafc" stroke="#dc2626" stroke-width="1.5"/>
    <!-- Clock hands -->
    <line x1="22" y1="22" x2="22" y2="14" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="22" x2="28" y2="22" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="22" cy="22" r="2" fill="#dc2626"/>
  </g>

  <!-- CHRONOS Text -->
  <text x="60" y="40" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="url(#gearGradient)" letter-spacing="1">CHR</text>

  <!-- First O as clock -->
  <g transform="translate(118, 20)">
    <circle cx="10" cy="12" r="11" fill="none" stroke="url(#chronosGradient)" stroke-width="3"/>
    <line x1="10" y1="12" x2="10" y2="6" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="12" x2="14" y2="12" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="10" cy="12" r="1.5" fill="#dc2626"/>
  </g>

  <text x="140" y="40" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="url(#gearGradient)" letter-spacing="1">N</text>

  <!-- Second O as clock -->
  <g transform="translate(166, 20)">
    <circle cx="10" cy="12" r="11" fill="none" stroke="url(#chronosGradient)" stroke-width="3"/>
    <line x1="10" y1="12" x2="10" y2="6" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="12" x2="14" y2="12" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="10" cy="12" r="1.5" fill="#dc2626"/>
  </g>

  <text x="188" y="40" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="url(#gearGradient)" letter-spacing="1">S</text>

  <!-- Decorative arrow -->
  <path d="M215 20 Q225 15 235 20 Q225 25 215 20" fill="none" stroke="#dc2626" stroke-width="2"/>
  <path d="M232 18 L238 20 L232 22" fill="#dc2626"/>
</svg>
